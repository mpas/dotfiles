rtk = "latest"
"github:terrastruct/d2" = { version = "latest", bin_path = "d2-v{{ version }}/bin", filter_bins = "d2" }
yarn = "latest"
"cargo:tokensave" = "latest"
"github:pete911/certinfo" = "latest"
superfile = "latest"

[env]
RTK_TELEMETRY_DISABLED = "1"
GRANTED_BROWSER_PROFILE = "Default"

[tasks]
ai-setup = { description = "Setup AI and install skills", run = [
  'npx skills add JuliusBrussee/caveman -g',
  'npx skills add https://github.com/anthropics/skills --skill docx -g',
  'npx skills add https://github.com/anthropics/skills --skill pptx -g',
  'npx skills add https://github.com/github/awesome-copilot --skill create-agentsmd -g',
  'npx skills add https://github.com/github/awesome-copilot --skill create-readme -g',
  'npx skills add https://github.com/github/awesome-copilot --skill editor-config -g',
  'npx skills add https://github.com/github/awesome-copilot --skill secret-scanning -g',
  'npx skills add https://github.com/mattpocock/skills --skill code-review -g',
  'npx skills add https://github.com/mattpocock/skills --skill codebase-design -g',
  'npx skills add https://github.com/mattpocock/skills --skill grill-me -g',
  'npx skills add https://github.com/mattpocock/skills --skill grill-with-docs -g',
  'npx skills add https://github.com/mattpocock/skills --skill research -g',
  'npx skills add https://github.com/mattpocock/skills --skill tdd -g',
  'npx skills add https://github.com/mattpocock/skills --skill teach -g',
  'npx skills add https://github.com/hashicorp/agent-skills --skill terraform-style-guide -g',
  'npx skills add vercel-labs/find-skills -g',
] }

ai-update = { description = "Update AI skills", run = ['npx skills update'] }


[settings]
idiomatic_version_file_enable_tools = []
github = { use_git_credentials = true }
