gopass = "latest"
gron = "latest"
gum = "latest"
httpie-go = "latest"
hugo = "latest"
hurl = "latest"
java = "openjdk-26"
jjui = "latest"
jq = "latest"
jujutsu = "latest"
just = "latest"
lazydocker = "latest"
lazygit = "latest"
marp-cli = "latest"
