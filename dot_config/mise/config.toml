ruff = "latest"
rust = "1.94.0"
sops = "latest"
terraform = "latest"
terraform-docs = "latest"
uv = "latest"
yq = "latest"
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }
zellij = "latest"
